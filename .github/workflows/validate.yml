name: Validate package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Package version for this candidate
        required: true
        default: 1.0.0-preview.1
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACKAGE_VERSION: ${{ inputs.version || '1.0.0-preview.1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build, test, pack and consume the exact candidate
        run: node scripts/validate.mjs --version "$PACKAGE_VERSION"
      - name: Retain verified package, symbols and provenance
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ env.PACKAGE_VERSION }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Show candidate provenance
        run: cat artifacts/manifest.json >> "$GITHUB_STEP_SUMMARY"
