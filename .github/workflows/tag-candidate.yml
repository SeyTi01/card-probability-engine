name: Tag verified candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful manual Validate package run
        required: true
        type: string
      rehearsal_run_id:
        description: Successful exact-candidate calculator rehearsal run
        required: true
        type: string
      version:
        description: Exact candidate version to tag
        required: true
        type: string
      source_commit:
        description: Full verified source commit
        required: true
        type: string
      package_sha256:
        description: Rehearsed candidate nupkg SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tag-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  tag:
    if: github.repository == 'SeyTi01/card-probability-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download the existing candidate
        uses: actions/download-artifact@v8
        with:
          name: package-${{ inputs.version }}
          path: artifacts/candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download its calculator rehearsal evidence
        uses: actions/download-artifact@v8
        with:
          name: calculator-rehearsal-${{ inputs.version }}
          path: artifacts/rehearsal
          run-id: ${{ inputs.rehearsal_run_id }}
          github-token: ${{ github.token }}
      - name: Validate both identities and create only the matching tag
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
          PACKAGE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
        run: node scripts/tag-candidate.mjs artifacts/candidate artifacts/rehearsal
