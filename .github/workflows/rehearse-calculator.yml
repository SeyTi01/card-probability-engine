name: Rehearse calculator candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful manual Validate package run
        required: true
        type: string
      version:
        description: Exact candidate package version
        required: true
        type: string
      source_commit:
        description: Full candidate source commit
        required: true
        type: string
      package_sha256:
        description: Expected candidate nupkg SHA-256
        required: true
        type: string
      host_commit:
        description: Full calculator comparison commit
        required: true
        default: 00d00c65a0ae3a8659d01eea7c5324806eb559e8
        type: string

permissions:
  contents: read
  actions: read

jobs:
  rehearse:
    if: github.repository == 'SeyTi01/card-probability-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      PACKAGE_VERSION: ${{ inputs.version }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      PACKAGE_SHA256: ${{ inputs.package_sha256 }}
      HOST_COMMIT: ${{ inputs.host_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          path: engine
      - uses: actions/checkout@v7
        with:
          repository: SeyTi01/ygo-advanced-probability-calculator-web
          ref: ${{ inputs.host_commit }}
          path: hosts/baseline
      - uses: actions/checkout@v7
        with:
          repository: SeyTi01/ygo-advanced-probability-calculator-web
          ref: ${{ inputs.host_commit }}
          path: hosts/candidate
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: engine/global.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Prepare production WASM and browser tools
        run: |
          dotnet workload install wasm-tools --version 10.0.402
          npm install --prefix "$RUNNER_TEMP/rehearsal-browser" playwright
          "$RUNNER_TEMP/rehearsal-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/rehearsal-browser/node_modules" >> "$GITHUB_ENV"
      - name: Download the unchanged verified candidate
        uses: actions/download-artifact@v8
        with:
          name: package-${{ inputs.version }}
          path: candidate-package
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify and rehearse the exact candidate
        working-directory: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rehearse-calculator.mjs ../candidate-package ../hosts/baseline ../hosts/candidate ../rehearsal-evidence
      - name: Retain identity, full replies and timing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: calculator-rehearsal-${{ inputs.version }}
          path: rehearsal-evidence/
          if-no-files-found: error
          retention-days: 90
